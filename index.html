  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-2: #0b1728;
      --panel: rgba(17, 31, 51, .88);
      --panel-2: #102039;
      --card: #101e32;
      --card-hover: #162944;
      --border: rgba(174, 201, 236, .13);
      --text: #f4f8ff;
      --muted: #9bacbf;
      --accent: #4b8cff;
      --cyan: #32d8f2;
      --violet: #a58bfa;
      --green: #45d6a1;
      --danger: #ff778d;
      --shadow: 0 18px 55px rgba(0, 0, 0, .22);
      --radius: 20px;
      --max: 1240px;
    }
    :root.light {
      color-scheme: light;
      --bg: #f3f7fc;
      --bg-2: #eaf1fb;
      --panel: rgba(255, 255, 255, .94);
      --panel-2: #f5f8fe;
      --card: #fff;
      --card-hover: #f0f6ff;
      --border: rgba(31, 57, 90, .13);
      --text: #10213a;
      --muted: #64748b;
      --accent: #2469df;
      --cyan: #009eb7;
      --violet: #7857d9;
      --green: #078c69;
      --danger: #c83a58;
      --shadow: 0 15px 40px rgba(28, 57, 91, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 8% -5%, rgba(48, 120, 255, .16), transparent 35%),
        radial-gradient(ellipse at 92% 12%, rgba(48, 216, 242, .09), transparent 27%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      transition: background .2s ease, color .2s ease;
    }
    body, button, input, textarea, select { font-family: inherit; }
    button, input, textarea, select { font-size: 14px; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
    a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    a { color: inherit; }
    .shell { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(18px);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .top-inner {
      min-height: 76px; display: flex; align-items: center; gap: 17px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      border: 0; background: transparent; color: var(--text); padding: 4px;
      text-align: left;
    }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center;
      font-weight: 950; font-size: 21px; color: white;
      background: linear-gradient(135deg, #1462ef, #13c9e5);
      box-shadow: 0 7px 24px rgba(37, 132, 255, .28);
      overflow: hidden;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    .brand-name { font-weight: 900; letter-spacing: .07em; font-size: 15px; line-height: 1.2; }
    .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: .12em; margin-top: 4px; }
    .search-wrap { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
    .search-wrap input {
      width: 100%; padding: 13px 42px 13px 42px; border-radius: 15px;
      color: var(--text); background: var(--panel); border: 1px solid var(--border);
    }
    .search-symbol {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 17px;
    }
    .search-shortcut {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 11px; border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 5px;
    }
    .icon-button {
      width: 42px; height: 42px; flex-shrink: 0; border: 1px solid var(--border);
      border-radius: 14px; background: var(--panel); color: var(--text);
      display: inline-grid; place-items: center; font-size: 18px;
    }
    .icon-button:hover { background: var(--card-hover); }
    .select-small {
      max-width: 135px; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
    }
    main { min-height: 68vh; padding: 24px 0 100px; }
    .hero {
      position: relative; overflow: hidden; border: 1px solid var(--border);
      border-radius: 28px; padding: clamp(25px, 5vw, 58px);
      background:
        radial-gradient(circle at 84% 16%, rgba(52, 218, 242, .18), transparent 25%),
        radial-gradient(circle at 65% 100%, rgba(82, 104, 255, .25), transparent 43%),
        linear-gradient(135deg, var(--panel), var(--bg-2));
      box-shadow: var(--shadow);
    }
    .hero:after {
      content: ""; position: absolute; right: -95px; bottom: -165px; width: 330px; height: 330px;
      border: 1px solid rgba(74, 160, 255, .25); border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(74,160,255,.035), 0 0 0 70px rgba(74,160,255,.025);
      pointer-events: none;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border);
      background: rgba(63, 137, 255, .1); padding: 7px 11px; border-radius: 999px;
      color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase;
    }
    .status-dot { width: 7px; height: 7px; background: var(--green); border-radius: 99px; }
    h1 { font-size: clamp(34px, 6vw, 67px); line-height: 1.04; letter-spacing: -.045em; margin: 21px 0 15px; max-width: 770px; }
    .gradient-text {
      background: linear-gradient(100deg, #5d9bff, #39dcf1 60%, #a5baff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-copy { max-width: 650px; font-size: clamp(14px, 2vw, 17px); color: var(--muted); margin: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 26px; position: relative; z-index: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 13px;
      background: var(--panel); color: var(--text); font-weight: 750;
      text-decoration: none; transition: transform .16s ease, background .16s ease;
    }
    .btn:hover { transform: translateY(-1px); background: var(--card-hover); }
    .btn-primary {
      color: white; border-color: transparent;
      background: linear-gradient(110deg, #2875f5, #278fe9 55%, #12b9d5);
      box-shadow: 0 10px 25px rgba(34, 120, 245, .19);
    }
    .btn-primary:hover { background: linear-gradient(110deg, #3982fb, #23bcd8); }
    .btn-danger { color: var(--danger); }
    .stats-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 26px; max-width: 630px; }
    .stat { padding: 13px 15px; border: 1px solid var(--border); border-radius: 15px; background: rgba(6, 15, 29, .12); }
    .stat strong { font-size: 19px; display: block; }
    .stat span { color: var(--muted); font-size: 11px; }
    .section-head {
      display: flex; align-items: end; justify-content: space-between; gap: 16px;
      margin: 34px 0 17px;
    }
    .section-head h2 { font-size: clamp(21px, 3vw, 29px); margin: 0; letter-spacing: -.025em; }
    .section-head p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .text-link { color: var(--cyan); font-weight: 750; background: transparent; border: 0; padding: 7px 0; }
    .category-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
    .chip {
      border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
      color: var(--muted); padding: 9px 13px; font-size: 12px; font-weight: 700;
    }
    .chip.active, .chip:hover { background: rgba(50, 139, 255, .14); border-color: rgba(61, 156, 255, .5); color: var(--text); }
    .tool-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
    .tool-card {
      min-width: 0; position: relative; border: 1px solid var(--border); border-radius: 18px;
      background: var(--card); padding: 17px; text-align: left; color: var(--text);
      display: flex; flex-direction: column; align-items: stretch; gap: 13px;
      transition: border-color .18s, transform .18s, background .18s;
    }
    .tool-card:hover { transform: translateY(-3px); border-color: rgba(60, 172, 255, .6); background: var(--card-hover); }
    .tool-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .tool-icon {
      width: 43px; height: 43px; border-radius: 14px; display: grid; place-items: center;
      font-size: 21px; flex-shrink: 0; background: linear-gradient(140deg, rgba(53, 124, 255, .22), rgba(46, 218, 236, .12));
      border: 1px solid rgba(103, 174, 255, .12);
    }
    .tool-fav {
      border: 0; background: transparent; color: var(--muted); font-size: 19px; padding: 2px 3px;
    }
    .tool-fav.is-saved { color: #f7c95d; }
    .tool-card h3 { font-size: 14px; line-height: 1.3; margin: 0 0 5px; }
    .tool-card p { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.55; }
    .tool-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
    .tool-category { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .tool-open { color: var(--cyan); font-size: 12px; font-weight: 800; }
    .feature-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-top: 26px; }
    .feature {
      display: flex; gap: 12px; padding: 18px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 17px;
    }
    .feature-icon { font-size: 22px; }
    .feature h3 { margin: 0 0 5px; font-size: 13px; }
    .feature p { margin: 0; color: var(--muted); font-size: 12px; }
    .notice {
      padding: 15px 17px; border: 1px solid var(--border); border-radius: 15px;
      background: var(--panel); color: var(--muted); font-size: 12px; margin-top: 16px;
    }
    .page-title { margin: 10px 0 7px; font-size: clamp(26px, 4vw, 39px); letter-spacing: -.035em; }
    .page-subtitle { color: var(--muted); margin: 0 0 20px; }
    .empty {
      text-align: center; padding: 45px 20px; border: 1px dashed var(--border); border-radius: 18px;
      color: var(--muted); background: var(--panel);
    }
    .empty-icon { font-size: 34px; margin-bottom: 8px; }
    .workspace-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .workspace-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
    .workspace-card h3 { margin: 0 0 7px; font-size: 17px; }
    .workspace-card p { color: var(--muted); font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 750; }
    .field input, .field textarea, .field select, .input {
      width: 100%; min-width: 0; padding: 12px 13px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--bg-2); color: var(--text);
    }
    .field textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
    .field select option, select option { background: var(--bg-2); color: var(--text); }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .result {
      margin-top: 15px; padding: 15px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(61, 141, 255, .07); overflow-wrap: anywhere;
    }
    .result-label { font-size: 10px; color: var(--muted); font-weight: 850; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 6px; }
    .result-value { font-size: 19px; font-weight: 800; }
    .result-text { color: var(--text); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 80; background: rgba(1, 7, 16, .78);
      backdrop-filter: blur(9px); padding: 20px; overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      width: min(740px, 100%); margin: auto; border: 1px solid var(--border);
      border-radius: 24px; background: var(--bg-2); box-shadow: 0 28px 90px rgba(0,0,0,.35); overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; gap: 13px; padding: 20px 22px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .modal-head .tool-icon { width: 47px; height: 47px; }
    .modal-heading { flex: 1; min-width: 0; }
    .modal-heading h2 { margin: 0; font-size: 19px; }
    .modal-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 22px; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 13px; }
    .modal-close { margin-left: auto; }
    .mini-card { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    .mini-card strong { display: block; font-size: 15px; }
    .mini-card span { font-size: 11px; color: var(--muted); }
    .clock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .clock-time { font-size: 21px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .timer-face {
      text-align: center; font-weight: 900; font-size: clamp(44px, 10vw, 73px);
      letter-spacing: -.04em; font-variant-numeric: tabular-nums; padding: 24px 0;
    }
    .timer-state { text-align: center; color: var(--muted); font-size: 12px; }
    .check-row { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; margin: 8px 0; }
    .check-row input { accent-color: var(--accent); }
    .todo-list { list-style: none; padding: 0; margin: 15px 0 0; display: grid; gap: 7px; }
    .todo-item { padding: 11px 12px; border: 1px solid var(--border); border-radius: 11px; display: flex; align-items: center; gap: 10px; }
    .todo-item span { flex: 1; overflow-wrap: anywhere; }
    .todo-item.done span { text-decoration: line-through; color: var(--muted); }
    .todo-item button { border: 0; background: transparent; color: var(--danger); }
    .footer { padding: 25px 0 100px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 14px; }
    .footer a, .footer button { color: var(--muted); text-decoration: none; border: 0; background: transparent; padding: 0; }
    .footer a:hover, .footer button:hover { color: var(--cyan); }
    .bottom-nav {
      display: none; position: fixed; z-index: 40; bottom: 0; left: 0; right: 0;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 91%, transparent);
      backdrop-filter: blur(18px);
    }
    .bottom-inner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 550px; margin: 0 auto; }
    .nav-item {
      border: 0; background: transparent; color: var(--muted); padding: 5px 1px;
      display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px;
      font-size: 10px; font-weight: 700;
    }
    .nav-item .nav-icon { font-size: 19px; line-height: 1.2; }
    .nav-item.active { color: var(--cyan); background: rgba(59, 141, 255, .1); }
    .toast {
      position: fixed; z-index: 120; left: 50%; bottom: 95px; transform: translate(-50%, 12px);
      opacity: 0; pointer-events: none; background: var(--text); color: var(--bg);
      padding: 11px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 12px; font-weight: 800;
      transition: opacity .18s, transform .18s; max-width: calc(100% - 30px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .qr-image { display: block; width: min(300px, 100%); margin: 14px auto; border-radius: 14px; background: white; padding: 10px; }
    .ad-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
    .ad-space { min-height: 42px; display: grid; place-items: center; margin: 20px 0; border: 1px dashed var(--border); border-radius: 13px; }
    .hidden { display: none !important; }
    @media (max-width: 1000px) {
      .tool-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .select-small { max-width: 120px; }
    }
    @media (max-width: 700px) {
      .shell { width: min(100% - 22px, var(--max)); }
      .top-inner { min-height: 65px; gap: 9px; }
      .brand-mark { width: 39px; height: 39px; border-radius: 13px; }
      .brand-sub { display: none; }
      .brand-name { font-size: 13px; }
      .search-wrap { max-width: none; }
      .search-wrap input { padding: 11px 12px 11px 35px; font-size: 12px; }
      .search-shortcut { display: none; }
      .search-symbol { left: 12px; }
      .select-small { display: none; }
      .top-inner > .icon-button { width: 39px; height: 39px; }
      main { padding-top: 14px; }
      .hero { border-radius: 23px; padding: 26px 20px; }
      h1 { font-size: clamp(34px, 10vw, 48px); }
      .stats-row { gap: 7px; }
      .stat { padding: 11px 10px; }
      .stat strong { font-size: 16px; }
      .stat span { font-size: 10px; }
      .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .tool-card { border-radius: 15px; padding: 13px; gap: 10px; }
      .tool-icon { width: 38px; height: 38px; border-radius: 12px; font-size: 19px; }
      .tool-card h3 { font-size: 13px; }
      .tool-card p { font-size: 11px; }
      .feature-strip { grid-template-columns: 1fr; gap: 9px; }
      .workspace-grid { grid-template-columns: 1fr; }
      .clock-grid { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 8px; }
      .modal { border-radius: 20px; margin: auto 0; }
      .modal-head { padding: 15px; }
      .modal-body { padding: 15px; }
      .field-row { grid-template-columns: 1fr; gap: 0; }
      .bottom-nav { display: block; }
      .footer { padding-bottom: 100px; }
    }
    @media (max-width: 370px) {
      .brand-name { max-width: 70px; }
      .tool-card { padding: 11px; }
      .tool-category { font-size: 9px; }
      .tool-open { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>

  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="bottom-inner">
      <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
      <button class="nav-item" data-page="tools"><span class="nav-icon">▦</span>Tools</button>
      <button class="nav-item" data-page="daily"><span class="nav-icon">◷</span>Daily</button>
      <button class="nav-item" data-page="global"><span class="nav-icon">◎</span>Global</button>
      <button class="nav-item" data-page="saved"><span class="nav-icon">☆</span>Saved</button>
    </div>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div class="tool-icon" id="modalIcon">⚡</div>
        <div class="modal-heading">
          <h2 id="modalTitle">Tool</h2>
          <p id="modalDescription">A simple, useful online tool.</p>
        </div>
        <button class="icon-button modal-close" id="modalClose" aria-label="Close tool">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const TOOLS = [
      { id:"calculator", name:"Smart Calculator", desc:"Evaluate everyday arithmetic safely.", cat:"Calculators", icon:"🧮", tag:"POPULAR" },
      { id:"percentage", name:"Percentage Calculator", desc:"Find percentages, totals and changes.", cat:"Calculators", icon:"％" },
      { id:"discount", name:"Discount Calculator", desc:"Calculate sale price and money saved.", cat:"Calculators", icon:"🏷️" },
      { id:"bmi", name:"BMI Calculator", desc:"Estimate BMI from height and weight.", cat:"Calculators", icon:"⚖️" },
      { id:"emi", name:"Loan / EMI Calculator", desc:"Estimate monthly payment and interest.", cat:"Calculators", icon:"💳" },
      { id:"age", name:"Age Calculator", desc:"Calculate age from a date of birth.", cat:"Calculators", icon:"🎂" },
      { id:"date-diff", name:"Date Difference", desc:"Count days between two dates.", cat:"Calculators", icon:"📅" },
      { id:"unit-converter", name:"Unit Converter", desc:"Convert length, mass and speed units.", cat:"Converters", icon:"🔄" },
      { id:"temperature", name:"Temperature Converter", desc:"Convert Celsius, Fahrenheit and Kelvin.", cat:"Converters", icon:"🌡️" },
      { id:"currency", name:"Currency Converter", desc:"Get an indicative rate from a public API.", cat:"Converters", icon:"💱", tag:"LIVE RATE" },
      { id:"word-counter", name:"Word & Character Counter", desc:"Count words, characters, lines and reading time.", cat:"Text", icon:"🔤" },
      { id:"case-converter", name:"Text Case Converter", desc:"Uppercase, lowercase, title case and more.", cat:"Text", icon:"Aa" },
      { id:"reverse-text", name:"Reverse Text", desc:"Reverse a text string instantly.", cat:"Text", icon:"↔️" },
      { id:"slug-maker", name:"Slug Generator", desc:"Create clean URL-friendly slugs.", cat:"Text", icon:"🔗" },
      { id:"duplicate-lines", name:"Remove Duplicate Lines", desc:"Deduplicate or sort a list of lines.", cat:"Text", icon:"☷" },
      { id:"base64", name:"Base64 Encoder / Decoder", desc:"Encode text or decode Base64 safely.", cat:"Developer", icon:"🔐" },
      { id:"url-codec", name:"URL Encoder / Decoder", desc:"Encode or decode URL components.", cat:"Developer", icon:"🌐" },
      { id:"json", name:"JSON Formatter", desc:"Format, minify and validate JSON.", cat:"Developer", icon:"{ }" },
      { id:"html-escape", name:"HTML Escape Tool", desc:"Escape or unescape HTML special characters.", cat:"Developer", icon:"</>" },
      { id:"markdown", name:"Markdown Preview", desc:"Preview basic Markdown formatting.", cat:"Developer", icon:"✍️" },
      { id:"lorem", name:"Lorem Text Generator", desc:"Create placeholder text on demand.", cat:"Text", icon:"📝" },
      { id:"password", name:"Password Generator", desc:"Generate a random password on this device.", cat:"Security", icon:"🛡️" },
      { id:"uuid", name:"UUID Generator", desc:"Create a random UUID in your browser.", cat:"Developer", icon:"🧬" },
      { id:"qr-code", name:"QR Code Generator", desc:"Create a QR code for a link or short text.", cat:"Utilities", icon:"▦" },
      { id:"image-optimizer", name:"Image Resizer & Compressor", desc:"Resize or export images in your browser.", cat:"Images", icon:"🖼️" },
      { id:"images-to-pdf", name:"Images to PDF", desc:"Combine images into a PDF document.", cat:"PDF", icon:"📄" },
      { id:"merge-pdf", name:"Merge PDF Files", desc:"Combine multiple PDFs in your browser.", cat:"PDF", icon:"📚" },
      { id:"split-pdf", name:"Extract First PDF Page", desc:"Create a new PDF from page one.", cat:"PDF", icon:"✂️" },
      { id:"pomodoro", name:"Focus Timer", desc:"Use a simple work and break timer.", cat:"Productivity", icon:"⏱️" },
      { id:"world-clock", name:"World Clock", desc:"Check the time in key global cities.", cat:"Productivity", icon:"🌍" },
      { id:"translator", name:"Quick Translation", desc:"Open your text in Google Translate.", cat:"Language", icon:"🗣️" },
      { id:"color-tools", name:"Color & Palette Tool", desc:"Choose a color and generate a palette.", cat:"Design", icon:"🎨" }
    ];

    const CATEGORIES = ["All", "Calculators", "Converters", "Text", "Developer", "Images", "PDF", "Utilities", "Productivity", "Security", "Language", "Design"];
    const STORAGE = {
      theme: "shaheen-theme-v1",
      region: "shaheen-region-v1",
      saved: "shaheen-saved-v1",
      notes: "shaheen-notes-v1",
      todos: "shaheen-todos-v1",
      logo: "shaheen-logo-v1"
    };

    const state = {
      page: "home",
      category: "All",
      query: "",
      saved: readJSON(STORAGE.saved, []),
      activeTool: null,
      timerSeconds: 25 * 60,
      timerRunning: false,
      timerMode: "Focus",
      timerInterval: null,
      imageFile: null,
      imageOutputUrl: null,
      region: localStorage.getItem(STORAGE.region) || "Global"
    };

    function readJSON(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v == null ? fallback : v;
      } catch (_) { return fallback; }
    }

    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (_) { toast("Browser storage is full. Please remove some saved data."); }
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[c]);
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.remove("show"), 2500);
    }

    function isSaved(id) { return state.saved.includes(id); }

    function toggleSaved(id) {
      state.saved = isSaved(id) ? state.saved.filter(x => x !== id) : [...state.saved, id];
      saveJSON(STORAGE.saved, state.saved);
      toast(isSaved(id) ? "Added to your favourites ★" : "Removed from favourites");
      render();
    }

    function filteredTools() {
      let list = TOOLS;
      if (state.page === "saved") list = list.filter(t => isSaved(t.id));
      if (state.category !== "All") list = list.filter(t => t.cat === state.category);
      const q = state.query.trim().toLowerCase();
      if (q) list = list.filter(t => [t.name, t.desc, t.cat, t.id].join(" ").toLowerCase().includes(q));
      return list;
    }

    function cardMarkup(t) {
      return `
        <article class="tool-card">
          <div class="tool-top">
            <div class="tool-icon" aria-hidden="true">${esc(t.icon)}</div>
            <button class="tool-fav ${isSaved(t.id) ? "is-saved" : ""}" data-fav="${esc(t.id)}"
              aria-label="${isSaved(t.id) ? "Remove" : "Save"} ${esc(t.name)}" title="Save favourite">
              ${isSaved(t.id) ? "★" : "☆"}
            </button>
          </div>
          <button data-tool="${esc(t.id)}" style="text-align:left;border:0;background:transparent;color:inherit;padding:0;display:flex;flex-direction:column;gap:7px;flex:1">
            <h3>${esc(t.name)}</h3>
            <p>${esc(t.desc)}</p>
          </button>
          <div class="tool-meta">
            <span class="tool-category">${esc(t.cat)}</span>
            <button class="text-link tool-open" data-tool="${esc(t.id)}">Open →</button>
          </div>
        </article>`;
    }

    function toolsGrid(list) {
      if (!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⌕</div><strong>No matching tools</strong><p>Try another keyword or choose a different category.</p><button class="btn" data-clear-search>Clear search</button></div>`;
      return `<div class="tool-grid" id="toolGrid">${list.map(cardMarkup).join("")}</div>`;
    }

    function categoryMarkup() {
      return `<div class="category-row">${CATEGORIES.map(c => `<button class="chip ${state.category === c ? "active" : ""}" data-category="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    }

    function renderHome() {
      const list = filteredTools();
      const featured = ["calculator", "word-counter", "qr-code", "image-optimizer", "json", "currency"]
        .map(id => TOOLS.find(t => t.id === id)).filter(Boolean);
      return `
        <section class="hero">
          <span class="eyebrow"><span class="status-dot"></span> YOUR EVERYDAY DIGITAL TOOLKIT</span>
          <h1>Big tasks.<br><span class="gradient-text">Smarter shortcuts.</span></h1>
          <p class="hero-copy">A practical collection of free tools for calculations, text, files and productivity — right in your browser, with no account needed.</p>
          <div class="hero-actions">
            <button class="btn btn-primary" data-page="tools">Explore all tools <span>↗</span></button>
            <button class="btn" data-tool="calculator">Try Smart Calculator</button>
          </div>
          <div class="stats-row">
            <div class="stat"><strong>${TOOLS.length}+</strong><span>Useful tools</span></div>
            <div class="stat"><strong>Browser-first</strong><span>Local processing where possible</span></div>
            <div class="stat"><strong>Global</strong><span>${esc(state.region)} selected</span></div>
          </div>
        </section>

        <div class="section-head">
          <div><h2>Jump right in</h2><p>Popular starting points for everyday tasks.</p></div>
          <button class="text-link" data-page="tools">View all tools →</button>
        </div>
        <div class="tool-grid">${featured.map(cardMarkup).join("")}</div>

        <div class="section-head"><div><h2>Browse the toolbox</h2><p>Find the right utility without digging through menus.</p></div></div>
        ${categoryMarkup()}
        ${toolsGrid(list)}

        <div class="feature-strip">
          <div class="feature"><div class="feature-icon">🔒</div><div><h3>Privacy-aware by design</h3><p>Many tools process text or images on your device. External services are labelled where used.</p></div></div>
          <div class="feature"><div class="feature-icon">📱</div><div><h3>Made for mobile</h3><p>Responsive layouts, touch-friendly controls and navigation made for small screens.</p></div></div>
          <div class="feature"><div class="feature-icon">★</div><div><h3>Your own quick list</h3><p>Save favourites on this device for faster access next time.</p></div></div>
        </div>
        <div class="notice"><strong>Transparency:</strong> SHAHEEN is growing. Advanced conversions may use a browser library or external service. Each tool shows what it does; do not upload sensitive files to services you do not trust.</div>
      `;
    }

    function renderToolsPage() {
      return `
        <h1 class="page-title">All tools, one place.</h1>
        <p class="page-subtitle">Search by task, browse a category or save the utilities you use most.</p>
        ${categoryMarkup()}
        ${toolsGrid(filteredTools())}
      `;
    }

    function renderSavedPage() {
      return `
        <h1 class="page-title">Your favourites ★</h1>
        <p class="page-subtitle">Saved locally on this device. No account required.</p>
        ${toolsGrid(filteredTools())}
        <div class="notice">Favourites are stored in this browser only. Clearing site data or switching devices may remove them.</div>
      `;
    }

    function renderDailyPage() {
      const todos = readJSON(STORAGE.todos, []);
      const notes = localStorage.getItem(STORAGE.notes) || "";
      return `
        <h1 class="page-title">Your daily workspace.</h1>
        <p class="page-subtitle">A tiny focus space for notes, tasks and finishing what matters.</p>
        <div class="workspace-grid">
          <section class="workspace-card">
            <h3>⏱️ Focus timer</h3>
            <p>Use a focused work session, then take a break.</p>
            <div class="timer-face" id="dailyTimerFace">${formatTime(state.timerSeconds)}</div>
            <div class="timer-state" id="dailyTimerState">${state.timerMode} · ${state.timerRunning ? "Running" : "Paused"}</div>
            <div class="modal-actions" style="justify-content:center">
              <button class="btn btn-primary" data-action="timer-toggle">${state.timerRunning ? "Pause" : "Start focus"}</button>
              <button class="btn" data-action="timer-reset">Reset</button>
              <button class="btn" data-action="timer-break">5 min break</button>
            </div>
          </section>
          <section class="workspace-card">
            <h3>📝 Quick notes</h3>
            <p>Notes stay in this browser on this device.</p>
            <div class="field"><textarea id="notesBox" placeholder="Write an idea, reminder or plan…">${esc(notes)}</textarea></div>
            <button class="btn btn-primary" data-action="save-notes">Save notes</button>
            <button class="btn" data-action="clear-notes">Clear</button>
          </section>
          <section class="workspace-card" style="grid-column:1/-1">
            <h3>✓ To-do list</h3>
            <p>Add small tasks and tick them off as you finish.</p>
            <div class="field-row">
              <div class="field"><input id="todoInput" placeholder="For example: test website on mobile"></div>
              <div class="field" style="justify-content:end"><button class="btn btn-primary" data-action="add-todo">Add task +</button></div>
            </div>
            <ul class="todo-list">${todos.length ? todos.map((t,i)=>`<li class="todo-item ${t.done?"done":""}"><input type="checkbox" data-todo-toggle="${i}" ${t.done?"checked":""} aria-label="Mark task done"><span>${esc(t.text)}</span><button data-todo-delete="${i}" aria-label="Delete task">✕</button></li>`).join("") : `<li class="notice">No tasks yet. Add one above to get started.</li>`}</ul>
          </section>
        </div>`;
    }

    function renderGlobalPage() {
      const cityZones = [
        ["Pakistan", "Asia/Karachi"],
        ["Riyadh", "Asia/Riyadh"],
        ["London", "Europe/London"],
        ["New York", "America/New_York"],
        ["Manama", "Asia/Bahrain"],
        ["Tokyo", "Asia/Tokyo"]
      ];
      return `
        <h1 class="page-title">A little more global. 🌍</h1>
        <p class="page-subtitle">Quick links for common international tasks. Choose a region in the top bar to personalize the workspace.</p>
        <div class="workspace-grid">
          <section class="workspace-card">
            <h3>🕒 World clock</h3>
            <p>Local times in different time zones.</p>
            <div class="clock-grid" id="worldClocks">${cityZones.map(([label,zone]) => `<div class="mini-card"><span>${esc(label)}</span><strong class="clock-time" data-zone="${esc(zone)}">--:--</strong><span data-date-zone="${esc(zone)}">Loading…</span></div>`).join("")}</div>
          </section>
          <section class="workspace-card">
            <h3>💱 Currency conversion</h3>
            <p>Check an indicative exchange rate using a public rates service.</p>
            <button class="btn btn-primary" data-tool="currency">Open currency converter →</button>
            <div class="notice">Exchange rates can change. Confirm important payments with your bank or provider.</div>
          </section>
          <section class="workspace-card">
            <h3>🗣️ Language help</h3>
            <p>Open a third-party translation service when you need a quick translation.</p>
            <button class="btn" data-tool="translator">Open quick translation →</button>
          </section>
          <section class="workspace-card">
            <h3>🌐 Network speed</h3>
            <p>Run an external internet speed test. Your test is performed by that service, not SHAHEEN.</p>
            <a class="btn" href="https://fast.com/" target="_blank" rel="noopener noreferrer">Open Fast.com ↗</a>
          </section>
        </div>`;
    }

    function renderInfoPage(page) {
      if (page === "about") return `
        <h1 class="page-title">About SHAHEEN</h1>
        <div class="workspace-card">
          <p>SHAHEEN Tools is a developing collection of digital utilities for everyday calculations, text tasks, file workflows and productivity.</p>
          <p>Our goal is to make common tasks easier to discover and use on mobile and desktop devices.</p>
          <p>Some functions use third-party services or browser libraries. Those tools are identified in their interface.</p>
          <p><strong>Developer:</strong> SHAHEEN Team</p>
        </div>`;
      return `
        <h1 class="page-title">Privacy overview</h1>
        <div class="workspace-card">
          <h3>What stays on this device?</h3>
          <p>Text utilities, calculators and several image operations run in your browser. Notes, tasks, theme preference, favourites and uploaded logo are saved locally using browser storage.</p>
          <h3>Third-party services</h3>
          <p>Currency rates, QR image creation, translation links, PDF libraries and advertising may connect to external providers. Those providers may receive the data necessary for their function. Avoid sending confidential information to third-party services.</p>
          <h3>Advertising</h3>
          <p>This build includes a Monetag advertising tag. Ad behaviour and data practices may depend on the provider and your settings.</p>
          <h3>Your choice</h3>
          <p>You can clear saved notes, tasks or site data from this browser. For questions, contact the website owner using a monitored contact address.</p>
          <div class="notice">Before publishing, replace placeholder contact information and have this privacy notice reviewed for the actual services and regions you support.</div>
        </div>`;
    }

    function render() {
      const view = document.getElementById("view");
      document.getElementById("searchInput").value = state.query;
      document.getElementById("regionSelect").value = state.region;
      document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.page === state.page));
      if (state.page === "home") view.innerHTML = renderHome();
      else if (state.page === "tools") view.innerHTML = renderToolsPage();
      else if (state.page === "saved") view.innerHTML = renderSavedPage();
      else if (state.page === "daily") view.innerHTML = renderDailyPage();
      else if (state.page === "global") view.innerHTML = renderGlobalPage();
      else if (state.page === "about" || state.page === "privacy") view.innerHTML = renderInfoPage(state.page);
      else view.innerHTML = renderHome();
      updateClocks();
      updateTimerDisplays();
    }

    function navigate(page) {
      state.page = page;
      state.category = "All";
      if (page !== "home" && page !== "tools" && page !== "saved") state.query = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openTool(id) {
      const tool = TOOLS.find(t => t.id === id);
      if (!tool) return;
      state.activeTool = id;
      state.imageFile = null;
      if (state.imageOutputUrl) { URL.revokeObjectURL(state.imageOutputUrl); state.imageOutputUrl = null; }

      document.getElementById("modalIcon").textContent = tool.icon;
      document.getElementById("modalTitle").textContent = tool.name;
      document.getElementById("modalDescription").textContent = tool.desc;
      document.getElementById("modalBody").innerHTML = toolForm(id);
      document.getElementById("modalBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
      if (id === "world-clock") updateClocks();
      if (id === "pomodoro") updateTimerDisplays();
    }

    function closeTool() {
      document.getElementById("modalBackdrop").classList.remove("open");
      document.body.style.overflow = "";
      state.activeTool = null;
      if (state.imageOutputUrl) {
        URL.revokeObjectURL(state.imageOutputUrl);
        state.imageOutputUrl = null;
      }
    }

    function field(label, id, type="text", placeholder="", value="") {
      return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${value}"></div>`;
    }
    function textareaField(label, id, placeholder="Paste or type here…", value="") {
      return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${placeholder}">${esc(value)}</textarea></div>`;
    }
    function selectField(label, id, options) {
      return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></div>`;
    }
    function outputBox() {
      return `<div class="result" id="toolOutput" aria-live="polite"><div class="result-label">Result</div><div class="result-text">Your result will appear here.</div></div>
        <div class="modal-actions"><button class="btn" data-action="copy-output">Copy result</button></div>`;
    }

    function toolForm(id) {
      switch (id) {
        case "word-counter":
          return `${textareaField("Your text", "textInput", "Start typing or paste your text…")}
            <div class="workspace-grid" id="countResults">
              <div class="mini-card"><span>Words</span><strong id="wordsCount">0</strong></div>
              <div class="mini-card"><span>Characters</span><strong id="charsCount">0</strong></div>
              <div class="mini-card"><span>Characters without spaces</span><strong id="charsNoSpaces">0</strong></div>
              <div class="mini-card"><span>Lines / reading time</span><strong id="linesCount">0 / 0 min</strong></div>
            </div><p class="notice">Counting is done locally in this browser.</p>`;
        case "case-converter":
          return `${textareaField("Your text", "textInput")}
            <div class="modal-actions">
              <button class="btn btn-primary" data-action="case-upper">UPPERCASE</button>
              <button class="btn" data-action="case-lower">lowercase</button>
              <button class="btn" data-action="case-title">Title Case</button>
              <button class="btn" data-action="case-sentence">Sentence case</button>
            </div>${outputBox()}`;
        case "reverse-text":
          return `${textareaField("Text to reverse", "textInput")}
            <div class="modal-actions"><button class="btn btn-primary" data-action="reverse">Reverse text</button></div>${outputBox()}`;
        case "slug-maker":
          return `${field("Text for URL slug", "textInput", "text", "Your page title")}
            <div class="modal-actions"><button class="btn btn-primary" data-action="slug">Generate slug</button></div>${outputBox()}`;
        case "duplicate-lines":
          return `${textareaField("Enter lines", "textInput", "One item per line…")}
            <div class="modal-actions"><button class="btn btn-primary" data-action="unique-lines">Remove duplicates</button><button class="btn" data-action="sort-lines">Sort lines A–Z</button></div>${outputBox()}`;
        case "base64":
          return `${textareaField("Input text", "textInput")}
            ${selectField("Operation", "operation", [["encode","Encode to Base64"],["decode","Decode Base64"]])}
            <div class="modal-actions"><button class="btn btn-primary" data-action="base64">Run</button></div>${outputBox()}
            <div class="notice">Base64 is an encoding format, not encryption.</div>`;
        case "url-codec":
          return `${textareaField("Input", "textInput")}
            ${selectField("Operation", "operation", [["encode","URL encode"],["decode","URL decode"]])}
            <div class="modal-actions"><button class="btn btn-primary" data-action="url-codec">Run</button></div>${outputBox()}`;
        case "json":
          return `${textareaField("JSON input", "textInput", '{"hello":"world","items":[1,2,3]}')}
            <div class="modal-actions"><button class="btn btn-primary" data-action="json-pretty">Format</button><button class="btn" data-action="json-minify">Minify</button><button class="btn" data-action="json-validate">Validate</button></div>${outputBox()}`;
        case "html-escape":
          return `${textareaField("Input", "textInput", '<h1>Hello & welcome</h1>')}
            ${selectField("Operation", "operation", [["escape","Escape HTML"],["unescape","Unescape HTML"]])}
            <div class="modal-actions"><button class="btn btn-primary" data-action="html-escape">Convert</button></div>${outputBox()}`;
        case "markdown":
          return `${textareaField("Markdown text", "textInput", "# Hello\n\nWrite **bold** text, *italic* text and a list:\n- One\n- Two")}
            <div class="modal-actions"><button class="btn btn-primary" data-action="markdown-preview">Preview</button></div>
            <div class="result"><div class="result-label">Preview</div><div id="markdownResult" class="result-text"></div></div>
            <div class="notice">Basic Markdown preview only; raw HTML is not rendered as HTML.</div>`;
        case "lorem":
          return `${field("Number of words", "loremCount", "number", "", "100")}

    function putOutput(value, label="Result") {
      const out = document.getElementById("toolOutput");

    function getInput(id) {
      const el = document.getElementById(id);
      return el ? el.value : "";
    }

    function toNumber(id) {
      const n = Number(getInput(id));
      if (!Number.isFinite(n)) throw new Error("Please enter a valid number.");
      return n;
    }

    function formatNumber(num, digits=6) {
      return Number(num.toFixed(digits)).toLocaleString(undefined, { maximumFractionDigits: digits });
    }

    async function copyText(value) {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
        else {
          const ta = document.createElement("textarea");
          ta.value = value; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          const ok = document.execCommand("copy"); ta.remove();
          if (!ok) throw new Error("Copy not supported");
        }
        toast("Copied to clipboard");
      } catch (_) { toast("Copy failed. Select the text and copy it manually."); }
    }

    function safeEvaluate(expression) {
      const s = String(expression).replace(/\s+/g, "");
      if (!s || !/^[0-9.+\-*/()%]+$/.test(s)) throw new Error("Use numbers and the operators + − × ÷ % with parentheses.");
      let i = 0;
      function expr() {
        let v = term();
        while (s[i] === "+" || s[i] === "-") {
          const op = s[i++];
          const r = term();
          v = op === "+" ? v + r : v - r;
        }
        return v;
      }
      function term() {
        let v = factor();
        while (s[i] === "*" || s[i] === "/" || s[i] === "%") {
          const op = s[i++];
          const r = factor();
          if ((op === "/" || op === "%") && r === 0) throw new Error("Cannot divide by zero.");
          v = op === "*" ? v * r : op === "/" ? v / r : v % r;
        }
        return v;
      }
      function factor() {
        if (s[i] === "+") { i++; return factor(); }
        if (s[i] === "-") { i++; return -factor(); }
        if (s[i] === "(") {
          i++;
          const v = expr();
          if (s[i] !== ")") throw new Error("Missing closing parenthesis.");
          i++;
          return v;
        }
        const start = i;
        while (i < s.length && /[0-9.]/.test(s[i])) i++;
        if (start === i) throw new Error("Expected a number.");
        const part = s.slice(start, i);
        if ((part.match(/\./g) || []).length > 1) throw new Error("Invalid number.");
        return Number(part);
      }
      const result = expr();
      if (i !== s.length || !Number.isFinite(result)) throw new Error("Please check the expression.");
      return result;
    }

    function titleCase(s) {
      return s.toLowerCase().replace(/\b[\p{L}\p{N}]/gu, c => c.toUpperCase());
    }

    function htmlUnescape(s) {
      const t = document.createElement("textarea");
      t.innerHTML = s;
      return t.value;
    }

    function markdownSafePreview(s) {
      let x = esc(s);
      x = x.replace(/^### (.*)$/gm, "<strong>$1</strong>")
           .replace(/^## (.*)$/gm, "<strong>$1</strong>")
           .replace(/^# (.*)$/gm, "<strong style='font-size:1.3em'>$1</strong>")
           .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
           .replace(/\*(.+?)\*/g, "<em>$1</em>")
           .replace(/`([^`]+)`/g, "<code>$1</code>")
           .replace(/^- (.*)$/gm, "• $1")
           .replace(/\n/g, "<br>");
      return x;
    }

    function updateWordCount() {
      const text = getInput("textInput");
      const words = text.trim() ? text.trim().split(/\s+/u).length : 0;
      const chars = text.length;
      const nonspace = [...text].filter(c => !/\s/u.test(c)).length;
      const lines = text ? text.split(/\r\n|\r|\n/).length : 0;
      const w = document.getElementById("wordsCount");
      if (!w) return;
      w.textContent = words;
      document.getElementById("charsCount").textContent = chars;
      document.getElementById("charsNoSpaces").textContent = nonspace;
      document.getElementById("linesCount").textContent = `${lines} / ${words ? Math.max(1, Math.ceil(words / 200)) : 0} min`;
    }

    function renderTimerFace() {
      const ids = ["dailyTimerFace", "modalTimerFace"];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = formatTime(state.timerSeconds);
      });
      ["dailyTimerState", "modalTimerState"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = `${state.timerMode} · ${state.timerRunning ? "Running" : "Paused"}`;
      });
      document.querySelectorAll('[data-action="timer-toggle"]').forEach(el => el.textContent = state.timerRunning ? "Pause" : "Start");
    }

    function formatTime(total) {
      const mm = String(Math.floor(total / 60)).padStart(2, "0");
      const ss = String(total % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function updateTimerDisplays() { renderTimerFace(); }

    function startTimer() {
      if (state.timerRunning) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        state.timerRunning = false;
      } else {
        state.timerRunning = true;
        state.timerInterval = setInterval(() => {
          if (state.timerSeconds > 0) state.timerSeconds--;
          else {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            state.timerRunning = false;
            toast(state.timerMode + " session complete!");
            try {
              if ("Notification" in window && Notification.permission === "granted") {
                new Notification("SHAHEEN Focus Timer", { body: state.timerMode + " session complete." });
              }
            } catch (_) {}
          }
          renderTimerFace();
        }, 1000);
      }
      renderTimerFace();
    }

    function setTimer(seconds, mode) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      state.timerRunning = false;
      state.timerSeconds = seconds;
      state.timerMode = mode;
      renderTimerFace();
    }

    function updateClocks() {
      document.querySelectorAll("[data-zone]").forEach(el => {
        try {
          el.textContent = new Intl.DateTimeFormat(undefined, {
            timeZone: el.dataset.zone, hour: "2-digit", minute: "2-digit", hour12: true
          }).format(new Date());
        } catch (_) { el.textContent = "--:--"; }
      });
      document.querySelectorAll("[data-date-zone]").forEach(el => {
        try {
          el.textContent = new Intl.DateTimeFormat(undefined, {
            timeZone: el.dataset.dateZone, weekday: "short", month: "short", day: "numeric"
          }).format(new Date());
        } catch (_) { el.textContent = ""; }
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function loadScript(src, globalName) {
      return new Promise((resolve, reject) => {
        if (window[globalName]) return resolve(window[globalName]);
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error("Library failed to load."));
        script.onerror = () => reject(new Error("Could not load the required library. Check your internet connection."));
        document.head.appendChild(script);
      });
    }

    async function getPDFLib() {
      const lib = await loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js", "PDFLib");
      return lib;
    }

    async function handleAction(action) {
      try {
        switch (action) {
          case "copy-output": {
            const el = document.getElementById("resultValue");
            const txt = el ? el.textContent : document.getElementById("toolOutput")?.innerText || "";
            if (!txt.trim()) return toast("There is no result to copy yet.");
            await copyText(txt); break;
          }
          case "case-upper": putOutput(getInput("textInput").toUpperCase()); break;
          case "case-lower": putOutput(getInput("textInput").toLowerCase()); break;
          case "case-title": putOutput(titleCase(getInput("textInput"))); break;
          case "case-sentence": {
            const s = getInput("textInput").toLowerCase().replace(/(^\s*[a-z])|([.!?]\s+[a-z])/g, m => m.toUpperCase());
            putOutput(s); break;
          }
          case "reverse": putOutput([...getInput("textInput")].reverse().join("")); break;
          case "slug": putOutput(getInput("textInput").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")); break;
          case "unique-lines": {
            const lines = getInput("textInput").split(/\r\n|\r|\n/);
            const out = [...new Set(lines)];
            putOutput(out.join("\n"), `${lines.length - out.length} duplicate line(s) removed`); break;
          }
          case "sort-lines": putOutput(getInput("textInput").split(/\r\n|\r|\n/).sort((a,b)=>a.localeCompare(b)).join("\n")); break;
          case "base64": {
            const v = getInput("textInput");
            const result = getInput("operation") === "encode" ? btoa(unescape(encodeURIComponent(v))) : decodeURIComponent(escape(atob(v.trim())));
            putOutput(result); break;
          }
          case "url-codec": putOutput(getInput("operation") === "encode" ? encodeURIComponent(getInput("textInput")) : decodeURIComponent(getInput("textInput"))); break;
          case "json-pretty": putOutput(JSON.stringify(JSON.parse(getInput("textInput")), null, 2)); break;
          case "json-minify": putOutput(JSON.stringify(JSON.parse(getInput("textInput")))); break;
          case "json-validate": JSON.parse(getInput("textInput")); putOutput("Valid JSON ✓", "Validation"); break;
          case "html-escape": putOutput(getInput("operation") === "escape" ? esc(getInput("textInput")) : htmlUnescape(getInput("textInput"))); break;
          case "markdown-preview": {
            const el = document.getElementById("markdownResult");
            if (el) el.innerHTML = markdownSafePreview(getInput("textInput"));
            break;
          }
          case "lorem": {
            const count = Math.max(1, Math.min(2000, Math.floor(toNumber("loremCount"))));
            const words = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua".split(" ");
            const out = Array.from({length: count}, (_,i) => words[i % words.length]);
            const text = out.join(" ").replace(/^lorem/, "Lorem");
            putOutput(text); break;
          }
          case "password": {
            const length = Math.max(8, Math.min(128, Math.floor(toNumber("passLength"))));
            let alphabet = "";
            if (document.getElementById("passUpper").checked) alphabet += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (document.getElementById("passLower").checked) alphabet += "abcdefghijklmnopqrstuvwxyz";
            if (document.getElementById("passNumbers").checked) alphabet += "0123456789";
            if (document.getElementById("passSymbols").checked) alphabet += "!@#$%^&*()-_=+[]{};:,.?";
            if (!alphabet) throw new Error("Choose at least one character group.");
            const buf = new Uint32Array(length);
            if (crypto.getRandomValues) crypto.getRandomValues(buf);
            else for (let i=0;i<length;i++) buf[i] = Math.floor(Math.random()*4294967295);
            putOutput(Array.from(buf, n => alphabet[n % alphabet.length]).join("")); break;
          }
          case "uuid": {
            const id = crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
              const r = Math.random() * 16 | 0;
              return (c === "x" ? r : (r & 3 | 8)).toString(16);
            });
            putOutput(id); break;
          }
          case "calculate": putOutput(formatNumber(safeEvaluate(getInput("calcInput")), 10)); break;
          case "calc-clear": document.getElementById("calcInput").value = ""; putOutput(""); break;
          case "percentage": {
            const p = toNumber("percentRate"), n = toNumber("percentNumber");
            putOutput(`${p}% of ${formatNumber(n)} = ${formatNumber(n*p/100)}\n${formatNumber(n)} + ${p}% = ${formatNumber(n*(1+p/100))}\n${formatNumber(n)} - ${p}% = ${formatNumber(n*(1-p/100))}`); break;
          }
          case "discount": {
            const price = toNumber("discountPrice"), rate = toNumber("discountRate");
            if (price < 0 || rate < 0 || rate > 100) throw new Error("Price must be non-negative and discount must be 0–100%.");
            putOutput(`Sale price: ${formatNumber(price*(1-rate/100))}\nYou save: ${formatNumber(price*rate/100)} (${rate}%)`); break;
          }
          case "bmi": {
            const kg = toNumber("bmiWeight"), cm = toNumber("bmiHeight");
            if (kg <= 0 || cm <= 0) throw new Error("Weight and height must be positive.");
            const bmi = kg / ((cm/100) ** 2);
            putOutput(`BMI: ${formatNumber(bmi, 2)}\nFor adults, common screening ranges are: below 18.5, 18.5–24.9, 25–29.9, and 30 or more. BMI alone does not determine health.`); break;
          }
          case "emi": {
            const principal = toNumber("emiPrincipal"), annual = toNumber("emiRate"), months = Math.floor(toNumber("emiMonths"));
            if (principal <= 0 || annual < 0 || months <= 0) throw new Error("Enter a positive loan amount and term, and a non-negative interest rate.");
            const r = annual / 1200;
            const payment = r === 0 ? principal/months : principal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);
            putOutput(`Estimated monthly payment: ${formatNumber(payment, 2)}\nTotal paid: ${formatNumber(payment*months, 2)}\nEstimated total interest: ${formatNumber(payment*months-principal, 2)}`); break;
          }
          case "age": {
            const value = getInput("birthDate");
            if (!value) throw new Error("Choose a date of birth.");
            const birth = new Date(value + "T00:00:00");
            const today = new Date();
            if (birth > today) throw new Error("Date of birth cannot be in the future.");
            let years = today.getFullYear() - birth.getFullYear();
            let months = today.getMonth() - birth.getMonth();
            let days = today.getDate() - birth.getDate();
            if (days < 0) { months--; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            putOutput(`${years} years, ${months} months and ${days} days`); break;
          }
          case "date-diff": {
            const a = getInput("dateStart"), b = getInput("dateEnd");
            if (!a || !b) throw new Error("Choose both dates.");
            const days = Math.round(Math.abs(new Date(a+"T00:00:00Z") - new Date(b+"T00:00:00Z")) / 86400000);
            putOutput(`${days.toLocaleString()} day(s) between the dates. The count excludes the starting day.`); break;
          }
          case "unit-convert": {
            const type = getInput("unitType"), value = toNumber("unitValue");
            const tables = {
              length: {m:1, km:1000, cm:.01, mi:1609.344, ft:.3048},
              mass: {kg:1, g:.001, lb:.45359237},
              speed: {kmh:1, mph:1.609344, ms:3.6}
            };
            const from = getInput("unitFrom"), to = getInput("unitTo");
            const table = tables[type];
            if (!(from in table) || !(to in table)) throw new Error("Choose units that match the selected type.");
            putOutput(`${formatNumber(value)} ${from} = ${formatNumber(value*table[from]/table[to])} ${to}`); break;
          }
          case "temperature": {
            const value = toNumber("tempValue"), from = getInput("tempFrom"), to = getInput("tempTo");
            let c = from === "C" ? value : from === "F" ? (value-32)*5/9 : value-273.15;
            let result = to === "C" ? c : to === "F" ? c*9/5+32 : c+273.15;
            if (to === "K" && result < 0) throw new Error("Temperature cannot be below absolute zero.");
            putOutput(`${formatNumber(value)}°${from} = ${formatNumber(result)}°${to}`); break;
          }
          case "currency": {
            const amount = toNumber("currencyAmount");
            const from = getInput("currencyFrom"), to = getInput("currencyTo");
            if (amount < 0) throw new Error("Amount must be non-negative.");
            putOutput("Fetching rate…");
            const resp = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(from)}`);
            if (!resp.ok) throw new Error("The currency service is currently unavailable.");
            const data = await resp.json();
            if (data.result !== "success" || !data.rates || !data.rates[to]) throw new Error("No rate available for this currency pair.");
            putOutput(`${formatNumber(amount)} ${from} ≈ ${formatNumber(amount * data.rates[to], 4)} ${to}\nRate timestamp: ${data.time_last_update_utc || "not provided"}\nSource: open.er-api.com`); break;
          }
          case "qr": {
            const val = getInput("qrText").trim();
            if (!val) throw new Error("Enter some text or a URL.");
            const src = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(val)}`;
            document.getElementById("qrResult").innerHTML = `<img class="qr-image" alt="Generated QR code" src="${src}"><p class="text-link" style="text-align:center"><a href="${src}" target="_blank" rel="noopener noreferrer">Open / save QR image ↗</a></p>`;
            break;
          }
          case "image-optimize": {
            const file = state.imageFile;
            if (!file) throw new Error("Choose an image first.");
            const widthTarget = Math.max(1, Math.min(12000, Math.floor(toNumber("imageWidth"))));
            const format = getInput("imageFormat");
            const quality = Math.max(.3, Math.min(1, Number(getInput("imageQuality"))/100));
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, widthTarget / bitmap.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(bitmap.width * scale));
            canvas.height = Math.max(1, Math.round(bitmap.height * scale));
            const ctx = canvas.getContext("2d", {alpha: format !== "image/jpeg"});
            if (!ctx) throw new Error("Canvas is not available in this browser.");
            if (format === "image/jpeg") { ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height); }
            ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close();
            const blob = await new Promise(resolve => canvas.toBlob(resolve, format, quality));
            if (!blob) throw new Error("This image format could not be created by your browser.");
            if (state.imageOutputUrl) URL.revokeObjectURL(state.imageOutputUrl);
            state.imageOutputUrl = URL.createObjectURL(blob);
            const ext = format === "image/jpeg" ? "jpg" : format === "image/png" ? "png" : "webp";
            document.getElementById("imageResult").innerHTML = `
              <div class="result"><div class="result-label">Processed image</div>
              <p class="result-text">${canvas.width} × ${canvas.height}px · ${formatBytes(blob.size)}</p>
              <img src="${state.imageOutputUrl}" alt="Processed preview" style="display:block;max-width:100%;max-height:350px;margin:12px auto;border-radius:12px">
              <a class="btn btn-primary" download="shaheen-image.${ext}" href="${state.imageOutputUrl}">Download image ↓</a></div>`;
            break;
          }
          case "images-to-pdf": {
            const files = [...(document.getElementById("pdfImages")?.files || [])];
            if (!files.length) throw new Error("Choose one or more JPG or PNG images.");
            const { PDFDocument } = await getPDFLib();
            const pdf = await PDFDocument.create();
            for (const file of files) {
              const bytes = await file.arrayBuffer();
              const image = file.type === "image/png" ? await pdf.embedPng(bytes) :
                file.type === "image/jpeg" ? await pdf.embedJpg(bytes) : null;
              if (!image) continue;
              const page = pdf.addPage([image.width, image.height]);
              page.drawImage(image, {x:0, y:0, width:image.width, height:image.height});
            }
            if (!pdf.getPageCount()) throw new Error("No supported JPG or PNG images found.");
            const bytes = await pdf.save();
            downloadBlob(new Blob([bytes], {type:"application/pdf"}), "shaheen-images.pdf");
            putOutput(`Created a PDF from ${pdf.getPageCount()} image(s). Your download should start shortly.`);
            break;
          }
          case "merge-pdf": {
            const files = [...(document.getElementById("pdfFiles")?.files || [])];
            if (files.length < 2) throw new Error("Choose at least two PDF files.");
            const { PDFDocument } = await getPDFLib();
            const merged = await PDFDocument.create();
            for (const file of files) {
              const doc = await PDFDocument.load(await file.arrayBuffer());
              const pages = await merged.copyPages(doc, doc.getPageIndices());
              pages.forEach(p => merged.addPage(p));
            }
            const bytes = await merged.save();
            downloadBlob(new Blob([bytes], {type:"application/pdf"}), "shaheen-merged.pdf");
            putOutput(`Merged ${files.length} PDF files into one document. Download should start shortly.`);
            break;
          }
          case "split-pdf": {
            const file = document.getElementById("pdfSingle")?.files?.[0];
            if (!file) throw new Error("Choose a PDF file.");
            const { PDFDocument } = await getPDFLib();
            const src = await PDFDocument.load(await file.arrayBuffer());
            if (!src.getPageCount()) throw new Error("The PDF contains no pages.");
            const dst = await PDFDocument.create();
            const [page] = await dst.copyPages(src, [0]);
            dst.addPage(page);
            const bytes = await dst.save();
            downloadBlob(new Blob([bytes], {type:"application/pdf"}), "shaheen-first-page.pdf");
            putOutput("The first page has been extracted. Download should start shortly.");
            break;
          }
          case "translate": {
            const text = getInput("translateText").trim();
            if (!text) throw new Error("Enter text to translate.");
            const from = getInput("translateFrom"), to = getInput("translateTo");
            const url = `https://translate.google.com/?sl=${encodeURIComponent(from)}&tl=${encodeURIComponent(to)}&text=${encodeURIComponent(text)}&op=translate`;
            window.open(url, "_blank", "noopener,noreferrer");
            toast("Opening translation in a new tab"); break;
          }
          case "palette": {
            const hex = getInput("colorInput").replace("#","");
            const base = [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));
            const toHex = a => "#" + a.map(n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0")).join("");
            const mix = (a,b,t) => a.map((v,i)=>v*(1-t)+b[i]*t);
            const colors = [mix(base,[0,0,0],.35), mix(base,[255,255,255],.25), base, mix(base,[255,255,255],.55), mix(base,[255,255,255],.8)].map(toHex);
            document.getElementById("paletteResult").innerHTML = `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:18px">${colors.map(c=>`<button data-copy-color="${c}" title="Copy ${c}" style="height:85px;border:1px solid var(--border);border-radius:12px;background:${c};color:${parseInt(c.slice(1),16)>0x777777?"#111":"#fff"};font-size:10px;font-weight:800">${c}</button>`).join("")}</div><p class="notice">Tap a swatch to copy its hex value.</p>`;
            break;
          }
          default: toast("This action is not available.");
        }
      } catch (error) {
        const message = error && error.message ? error.message : "Something went wrong. Please try again.";
        if (document.getElementById("toolOutput")) putOutput(message, "Please check");
        else toast(message);
      }
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
      return (bytes/(1024*1024)).toFixed(2) + " MB";
    }

    function addTodo() {
      const input = document.getElementById("todoInput");
      const text = input?.value.trim();
      if (!text) return toast("Enter a task first.");
      const todos = readJSON(STORAGE.todos, []);
      todos.push({ text, done:false });
      saveJSON(STORAGE.todos, todos);
      render();
      toast("Task added");
    }

    async function shareWebsite() {
      const shareData = {
        title: "SHAHEEN Tools",
        text: "Useful free online tools for everyday tasks.",
        url: location.href.split("#")[0]
      };
      try {
        if (navigator.share) await navigator.share(shareData);
        else await copyText(shareData.url);
      } catch (e) {
        if (e.name !== "AbortError") toast("Sharing cancelled or not available.");
      }
    }

    document.addEventListener("click", async e => {
      const pageButton = e.target.closest("[data-page]");
      if (pageButton) { e.preventDefault(); navigate(pageButton.dataset.page); return; }

      const categoryButton = e.target.closest("[data-category]");
      if (categoryButton) {
        state.category = categoryButton.dataset.category;
        render(); return;
      }

      const fav = e.target.closest("[data-fav]");
      if (fav) { e.preventDefault(); toggleSaved(fav.dataset.fav); return; }

      const tool = e.target.closest("[data-tool]");
      if (tool) { openTool(tool.dataset.tool); return; }

      const act = e.target.closest("[data-action]");
      if (act) {
        const action = act.dataset.action;
        if (action === "timer-toggle") { startTimer(); return; }
        if (action === "timer-reset") { setTimer(25*60, "Focus"); return; }
        if (action === "timer-break") { setTimer(5*60, "Break"); return; }
        if (action === "timer-focus") { setTimer(25*60, "Focus"); return; }
        if (action === "save-notes") {
          localStorage.setItem(STORAGE.notes, getInput("notesBox"));
          toast("Notes saved on this device"); return;
        }
        if (action === "clear-notes") {
          localStorage.removeItem(STORAGE.notes);
          const box = document.getElementById("notesBox");
          if (box) box.value = "";
          toast("Notes cleared"); return;
        }
        if (action === "add-todo") { addTodo(); return; }
        await handleAction(action);
        return;
      }

      const todoToggle = e.target.closest("[data-todo-toggle]");
      if (todoToggle) {
        const todos = readJSON(STORAGE.todos, []);
        const i = Number(todoToggle.dataset.todoToggle);
        if (todos[i]) todos[i].done = todoToggle.checked;
        saveJSON(STORAGE.todos, todos); render(); return;
      }

      const todoDelete = e.target.closest("[data-todo-delete]");
      if (todoDelete) {
        const todos = readJSON(STORAGE.todos, []);
        todos.splice(Number(todoDelete.dataset.todoDelete), 1);
        saveJSON(STORAGE.todos, todos); render(); return;
      }

      const calcChar = e.target.closest("[data-calc-char]");
      if (calcChar) {
        const input = document.getElementById("calcInput");
        if (input) { input.value += calcChar.dataset.calcChar; input.focus(); }
        return;
      }

      const color = e.target.closest("[data-copy-color]");
      if (color) { await copyText(color.dataset.copyColor); return; }

      if (e.target.closest("[data-clear-search]")) {
        state.query = ""; state.category = "All"; render(); return;
      }
    });

    document.addEventListener("input", e => {
      if (e.target.id === "searchInput") {
        state.query = e.target.value;
        const view = document.getElementById("view");
        if (state.page === "home") {
          const grid = document.getElementById("toolGrid");
          if (grid) grid.outerHTML = toolsGrid(filteredTools());
          else render();
        } else if (["tools","saved"].includes(state.page)) {
          const grid = document.getElementById("toolGrid");
          if (grid) grid.outerHTML = toolsGrid(filteredTools());
          else render();
        }
      }
      if (e.target.id === "textInput" && state.activeTool === "word-counter") updateWordCount();
      if (e.target.id === "imageQuality") {
        const label = document.getElementById("imageQualityLabel");
        if (label) label.textContent = e.target.value + "%";
      }
    });

    document.addEventListener("change", e => {
      if (e.target.id === "regionSelect") {
        state.region = e.target.value;
        localStorage.setItem(STORAGE.region, state.region);
        render();
      }
      if (e.target.id === "unitType") {
        const type = e.target.value;
        const opts = {
          length: [["m","Meters"],["km","Kilometers"],["cm","Centimeters"],["mi","Miles"],["ft","Feet"]],
          mass: [["kg","Kilograms"],["g","Grams"],["lb","Pounds"]],
          speed: [["kmh","km/h"],["mph","mph"],["ms","m/s"]]
        }[type];
        ["unitFrom","unitTo"].forEach((id,i) => {
          const el = document.getElementById(id);
          if (el) {
            el.innerHTML = opts.map((o,j)=>`<option value="${o[0]}">${o[1]}</option>`).join("");
            el.value = opts[Math.min(i, opts.length-1)][0];
          }
        });
      }
      if (e.target.id === "imageFile") {
        state.imageFile = e.target.files?.[0] || null;
        if (state.imageFile) toast("Image ready to process");
      }
    });

    document.getElementById("modalClose").addEventListener("click", closeTool);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeTool();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeTool();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault(); document.getElementById("searchInput").focus();
      }
      if (e.key === "Enter" && state.activeTool === "calculator" && document.activeElement?.id === "calcInput") {
        e.preventDefault(); handleAction("calculate");
      }
    });

    document.getElementById("themeButton").addEventListener("click", () => {
      const light = document.documentElement.classList.toggle("light");
      localStorage.setItem(STORAGE.theme, light ? "light" : "dark");
      document.getElementById("themeButton").textContent = light ? "☾" : "☼";
    });

    document.getElementById("logoButton").addEventListener("click", () => document.getElementById("logoUpload").click());
    document.getElementById("logoUpload").addEventListener("change", e => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 1024*1024) { toast("Please choose a logo smaller than 1 MB."); return; }
      if (!file.type.startsWith("image/")) { toast("Choose an image file."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          localStorage.setItem(STORAGE.logo, reader.result);
          applyLogo();
          toast("Custom logo saved on this device");
        } catch (_) { toast("Logo could not be saved. Try a smaller image."); }
      };
      reader.readAsDataURL(file);
    });

    function applyLogo() {
      const data = localStorage.getItem(STORAGE.logo);
      const mark = document.getElementById("brandMark");
      if (data) mark.innerHTML = `<img alt="Custom SHAHEEN logo" src="${data}">`;
      else mark.textContent = "S";
    }

    document.getElementById("shareButton").addEventListener("click", shareWebsite);
    document.getElementById("year").textContent = new Date().getFullYear();

    const savedTheme = localStorage.getItem(STORAGE.theme);
    if (savedTheme === "light") {
      document.documentElement.classList.add("light");
      document.getElementById("themeButton").textContent = "☾";
    }
    applyLogo();
    render();
    setInterval(updateClocks, 30000);

    /*
      IMPORTANT:
      - Google AdSense is not included in this version.
      - Keep the Monetag zone configured for your own website in your Monetag account.
      - Add Monetag's separate verification meta tag/file only if your account asks for it.
      - Do not add fake publisher details or copy verification records from another website.
      - Some utilities intentionally use third-party services; those limitations are stated in the UI.
    */
  </script>
</body>
